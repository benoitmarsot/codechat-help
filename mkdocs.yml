site_name: LiquidAmber Help
site_url: https://www.liquidamber.ai/help/
theme:
  name: material
  logo: images/logo.svg
  favicon: images/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
extra_css:
  - stylesheets/liquidamber.css
nav:
  - Home: index.md
  - Products:
      - Discover:
          - Overview: discover.md
          - Getting Started: discover-getting-started.md
          - Projects & Collaboration: discover-projects.md
          - Interface Guide: discover-interface.md
          - Evidence & Response Tools: discover-research-trails.md
          - Personal Memory: personal-memory.md
          - Troubleshooting: discover-troubleshooting.md
          - Deep Archive Search: discover-local-two-step-journalist-guide.md
      - Describe: describe.md
      - Verify: verify.md
      - Engage: engage.md
  - Account & Password: account-and-password.md
  - Export & Share: export-and-share.md
  - Administration:
      - Overview: admin.md
      - Launch a New Outlet: admin-outlet-launch-checklist.md
      - Organizations & Outlets: admin-outlets.md
      - Users & Access: admin-users.md
      - Announcements: admin-announcements.md
      - Feedback Review: admin-feedback.md
  - About: about.md
  - Newsroom FAQ: liquidamber-journalism-FAQ.md
  - Intellectual Property: intellectual-property.md
  - Contact: contact.md
